services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.server
    environment:
      # "Today" decides which holiday and which agenda is shown. Without this the
      # container runs UTC and the day flips at 02:00 local time.
      TZ: ${TZ:-Europe/Berlin}
      # Tokens come from .env next to this file and stay inside the container.
      GITLAB_TOKEN: ${GITLAB_TOKEN:?GITLAB_TOKEN fehlt - .env.example kopieren}
      JIRA_TOKEN: ${JIRA_TOKEN:-}
      JIRA_EMAIL: ${JIRA_EMAIL:-}
      # Named by calendar.sources[].env in the config; without it that panel stays empty.
      CALENDAR_ICS_URL: ${CALENDAR_ICS_URL:-}
      DASHBOARD_CONFIG: /config/dashboard.config.json
    volumes:
      # Mounted, not baked in: edit the file and restart, no rebuild. The default
      # is the example config; point DASHBOARD_CONFIG_FILE at your own file
      # (dashboard.config.local.json) to run the container on real data.
      - ${DASHBOARD_CONFIG_FILE:-./dashboard.config.json}:/config/dashboard.config.json:ro
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      API_UPSTREAM: api:3399
    ports:
      - '8088:8080'
    depends_on:
      - api
    restart: unless-stopped

networks:
  default:
    ipam:
      config:
        # A VPN can install 0.0.0.0/1 and 128.0.0.0/1 routes; Docker then finds no
        # free address pool and refuses to create the network. Pinning one skips
        # that search. Set DOCKER_SUBNET if 172.28.0.0/24 clashes on your host.
        - subnet: ${DOCKER_SUBNET:-172.28.0.0/24}

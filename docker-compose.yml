services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.server
    environment:
      # "Today" decides which holiday and which agenda is shown. Without this the
      # container runs UTC and the day flips at 02:00 local time.
      TZ: ${TZ:-Europe/Berlin}
      # Tokens come from .env next to this file and stay inside the container.
      GITLAB_TOKEN: ${GITLAB_TOKEN:?GITLAB_TOKEN fehlt - .env.example kopieren}
      JIRA_TOKEN: ${JIRA_TOKEN:-}
      JIRA_EMAIL: ${JIRA_EMAIL:-}
      # Named by calendar.sources[].env in the config; without it that panel stays empty.
      CALENDAR_ICS_URL: ${CALENDAR_ICS_URL:-}
      DASHBOARD_CONFIG: /config/dashboard.config.json
      # Wallets, rewards and inbox; the schema is created on start.
      DATABASE_URL: postgres://dashboard:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt - .env.example kopieren}@db:5432/dashboard
    volumes:
      # Mounted, not baked in: edit the file and restart, no rebuild. The default
      # is the example config; point DASHBOARD_CONFIG_FILE at your own file
      # (dashboard.config.local.json) to run the container on real data.
      - ${DASHBOARD_CONFIG_FILE:-./dashboard.config.json}:/config/dashboard.config.json:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dashboard
      POSTGRES_USER: dashboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt - .env.example kopieren}
    volumes:
      # The wallets live here; removing the volume resets every player to zero.
      - dashboard-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dashboard -d dashboard']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # 3D figures and icons live in their own repository, expected next to this one.
  # Set AVATAR_SOURCE if it is elsewhere; port 8089 also feeds "npm run dev".
  avatar:
    build:
      context: ${AVATAR_SOURCE:-../daily-dashboard-avatar}
    ports:
      - '8089:8080'
    restart: unless-stopped

  # No port of its own: every request goes through oauth2-proxy, which sets the
  # X-Forwarded-Email the api reads. A published port here would bypass the login.
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      API_UPSTREAM: api:3399
      AVATAR_UPSTREAM: avatar:8080
    depends_on:
      - api
      - avatar
    restart: unless-stopped

  # Dev only: in-memory database, admin/admin. Served below /auth on the same
  # origin as the board, so browser and containers agree on one issuer URL.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: [start-dev, --import-realm]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_RELATIVE_PATH: /auth
      # Front channel as the browser sees it; back channel (oauth2-proxy redeeming
      # the code at keycloak:8080) is answered on whatever host it was called by.
      KC_HOSTNAME: http://localhost:8088/auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: 'true'
      KC_PROXY_HEADERS: xforwarded
      # Filled into the realm file on import.
      KC_CLIENT_SECRET: dev-only-client-secret
      DASHBOARD_URL: http://localhost:8088
    volumes:
      # Keycloak imports only the *.json files in this directory.
      - ./auth:/opt/keycloak/data/import:ro
    restart: unless-stopped

  # One-shot: one login per team member of the mounted config, password = the
  # lowercased name. Users stay out of the realm file, which is also shipped.
  dev-users:
    image: node:24-alpine
    command: [node, /auth/dev-users.mjs]
    volumes:
      - ./auth:/auth:ro
      - ${DASHBOARD_CONFIG_FILE:-./dashboard.config.json}:/config/dashboard.config.json:ro
    depends_on:
      - keycloak
    restart: 'no'

  # The only way in. Keycloak's login pages under /auth/realms are public; the
  # admin console under /auth/admin still needs a board login first.
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.4
    environment:
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_UPSTREAMS: http://web:8080/,http://keycloak:8080/auth/
      OAUTH2_PROXY_SKIP_AUTH_ROUTES: ^/auth/(realms|resources)/
      OAUTH2_PROXY_PROVIDER: keycloak-oidc
      OAUTH2_PROXY_CLIENT_ID: daily-dashboard
      OAUTH2_PROXY_CLIENT_SECRET: dev-only-client-secret
      OAUTH2_PROXY_REDIRECT_URL: http://localhost:8088/oauth2/callback
      # Discovery would fetch localhost:8088 from inside the container, which is
      # the container itself. The browser gets the public URL, the rest goes direct.
      OAUTH2_PROXY_OIDC_ISSUER_URL: http://localhost:8088/auth/realms/daily-dashboard
      OAUTH2_PROXY_SKIP_OIDC_DISCOVERY: 'true'
      OAUTH2_PROXY_LOGIN_URL: http://localhost:8088/auth/realms/daily-dashboard/protocol/openid-connect/auth
      OAUTH2_PROXY_REDEEM_URL: http://keycloak:8080/auth/realms/daily-dashboard/protocol/openid-connect/token
      OAUTH2_PROXY_OIDC_JWKS_URL: http://keycloak:8080/auth/realms/daily-dashboard/protocol/openid-connect/certs
      OAUTH2_PROXY_BACKEND_LOGOUT_URL: http://keycloak:8080/auth/realms/daily-dashboard/protocol/openid-connect/logout?id_token_hint={id_token}
      OAUTH2_PROXY_CODE_CHALLENGE_METHOD: S256
      OAUTH2_PROXY_EMAIL_DOMAINS: '*'
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: 'true'
      # The board hangs on a TV: a week-long cookie, refreshed hourly against
      # keycloak, whose realm keeps the session for 30 days.
      OAUTH2_PROXY_COOKIE_SECRET: ZGV2LW9ubHktY29va2llLXNlY3JldC0zMmJ5dGVzISE=
      OAUTH2_PROXY_COOKIE_SECURE: 'false'
      OAUTH2_PROXY_COOKIE_EXPIRE: 168h
      OAUTH2_PROXY_COOKIE_REFRESH: 1h
    ports:
      - '8088:4180'
    depends_on:
      - web
      - keycloak
    restart: unless-stopped

volumes:
  dashboard-db:

networks:
  default:
    ipam:
      config:
        # A VPN can install 0.0.0.0/1 and 128.0.0.0/1 routes; Docker then finds no
        # free address pool and refuses to create the network. Pinning one skips
        # that search. Set DOCKER_SUBNET if 172.28.0.0/24 clashes on your host.
        - subnet: ${DOCKER_SUBNET:-172.28.0.0/24}

# Placeholders are filled by startnginx.sh at container start, so one image
# serves localhost and the cluster. API_UPSTREAM is host:port of the proxy;
# in Kubernetes set it to <service>.<namespace>:3399.
upstream api {
    server $API_UPSTREAM;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Dashboard runs on a TV in the room: no caching of the entry document,
    # so a redeploy is picked up by a plain reload.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

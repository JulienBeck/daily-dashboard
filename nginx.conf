# Placeholders are filled by startnginx.sh at container start, so one image
# serves localhost and the cluster. API_UPSTREAM is host:port of the proxy;
# in Kubernetes set it to <service>.<namespace>:3399.
upstream api {
    server $API_UPSTREAM;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Longer prefix wins, so the hashed files keep their year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    # Dashboard runs on a TV in the room, so a redeploy has to be picked up by
    # a plain reload. The entry document names the hashed asset files; a cached
    # copy keeps serving an old build forever, because those assets are
    # immutable. This has to sit here and not on "location = /index.html":
    # nobody requests that address. Browsers ask for "/", which the index module
    # answers from this block, and an exact-match rule never sees it. "always"
    # so the header survives a 304 as well.
    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }
}
